name: flight
version: "1.0"
description: >
  Flight specialist for the Smartinerary platform.
  Given an origin, destination, and travel date, searches for available flights
  and returns the best options ranked by cost, comfort, or journey time.

output_schema_variant: full_v1
runtime_profile: workflow

llm:
  lane: middle
  temperature: 0.1
  max_tokens_per_call: 4000
  prompt_templates_dir: "prompts/agents/flight"
  model_overrides:
    middle: "gemini/gemini-2.0-flash"    # Gemini Flash — balanced

graph:
  allowed_cypher_templates: []

tool_calling:
  enabled: true
  max_tool_iterations: 5
  max_llm_calls: 8
  max_cost_usd: 0.50
  enabled_tools:
    - search_flights

budget:
  max_cost_usd: 0.75
  max_tokens_total: 40000
  max_tokens_input: 32000
  max_tokens_output: 8000
  max_llm_calls: 10
  on_budget_exceeded: return_partial

observability:
  langfuse_session_tag: flight
  log_level: INFO
